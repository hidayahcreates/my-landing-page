<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
    }
    header p {
      margin: 0;
      font-size: 1.2rem;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      margin-top: 1rem;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #3730a3;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #777;
    }
    form {
      margin-top: 2rem;
    }
    input[type="email"] {
      padding: 0.7rem;
      width: 70%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 0.3rem;
    }
    input[type="submit"] {
      padding: 0.7rem 1rem;
      border: none;
      background: #4f46e5;
      color: white;
      border-radius: 0.3rem;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    input[type="submit"]:hover {
      background: #3730a3;
    }
  </style>
</head>
<body>

<header>
  <h1>Welcome to My Product</h1>
  <p>The simplest way to solve your problem — for free.</p>
</header>

<div class="container">
  <h2>Get Started Now</h2>
  <p>Sign up with your email to get early access and updates.</p>
  
  <form onsubmit="subscribe(event)">
    <input type="email" id="email" placeholder="Enter your email" required />
    <input type="submit" value="Subscribe" />
  </form>

  <a href="#learn-more" class="btn">Learn More</a>
</div>

<footer>
  &copy; 2025 My Landing Page. All rights reserved.
</footer>

<script>
  function subscribe(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    alert('Thank you for subscribing, ' + email + '!');
    document.getElementById('email').value = '';
  }
</script>

</body>
</html>
